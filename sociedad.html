<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sociedades | Revende Ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
    --bg:#0b0d12; --bg2:#111318; --bg3:#16181f; --surface:#1c1f2a; --surface2:#222536;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --text:#e8eaf0; --text2:#9aa0b4; --text3:#5a6070;
    --green:#00c96e; --green-pale:rgba(0,201,110,.12);
    --amber:#f59e0b; --amber-pale:rgba(245,158,11,.12);
    --red:#f43f5e; --red-pale:rgba(244,63,94,.12);
    --blue:#0066ff; --blue-pale:rgba(0,102,255,.12);
    --radius:10px; --font:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    min-height:100vh; padding-bottom:40px; -webkit-font-smoothing:antialiased;
}
.topbar{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
}
.topbar .back{
    background:var(--surface); border:1px solid var(--border2); color:var(--text);
    border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
}
.topbar h1{font-size:16px; font-weight:800}
.topbar .sub{font-size:11px; color:var(--text2)}
.wrap{max-width:min(92vw, 820px); margin:0 auto; padding:16px}
/* 🆕 Antes .wrap tenía un ancho fijo de 640px (pensado solo para celular)
   y no había ninguna media query en todo el archivo: en monitores grandes
   quedaba una columna angosta centrada con mucho espacio vacío alrededor.
   Ahora crece de forma fluida (92% del ancho, con un tope de 820px para
   no estirar de más un formulario de una sola columna). */
.card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
}
.card h2{font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px}
.card h2 svg{flex-shrink:0}
label{font-size:11.5px; color:var(--text2); font-weight:600; display:block; margin-bottom:5px; margin-top:10px}
label:first-child{margin-top:0}
select,input{
    width:100%; background:var(--bg3); border:1px solid var(--border2); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:13.5px; font-family:var(--font);
}
select:focus,input:focus{outline:none; border-color:var(--blue)}
.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:var(--font); width:100%; margin-top:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.btn-primary{background:var(--blue); color:#fff}
.btn-green{background:var(--green); color:#0b0d12}
.btn-outline{background:transparent; border:1px solid var(--border2); color:var(--text)}
.btn-red{background:var(--red-pale); color:var(--red); border:1px solid rgba(244,63,94,.2)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-sm{width:auto; padding:7px 12px; font-size:12px; margin-top:0}
.row{display:flex; gap:8px}
.row>*{flex:1}
.pill{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
    padding:3px 9px; border-radius:20px;
}
.pill-abierta{background:var(--green-pale); color:var(--green)}
.pill-pagada{background:var(--blue-pale); color:var(--blue)}
.pill-cerrada{background:rgba(255,255,255,.08); color:var(--text2)}
.pill-pendiente{background:var(--amber-pale); color:var(--amber)}
.empty{text-align:center; color:var(--text3); font-size:12.5px; padding:22px 10px}
.empty svg{opacity:.4; margin-bottom:8px}
.soc-item{
    background:var(--bg3); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; cursor:pointer;
}
.soc-item:active{opacity:.85}
.soc-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.soc-head strong{font-size:13px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.soc-meta{font-size:11px; color:var(--text2); margin-top:4px}
/* 🆕 FIX: acotado solo a este aviso puntual (no toca .soc-meta en
   general) — texto largo que en celulares angostos se partía en 2
   renglones. La letra se achica sola según el ancho de pantalla
   (clamp) y, en el caso extremo de no entrar igual, corta con "…" en
   vez de envolverse. */
.soc-inv-pendiente-aviso{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-size:clamp(9.5px, 2.8vw, 11px);
}
.bar-track{background:rgba(255,255,255,.08); border-radius:20px; height:8px; margin-top:8px; overflow:hidden}
.bar-fill{background:var(--green); height:100%; border-radius:20px; transition:width .3s}
.bar-fill.falta{background:var(--amber)}
.member-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 0; border-top:1px solid var(--border);
}
.member-row:first-child{border-top:none}
.member-row>div:first-child{min-width:0; flex:1}
.member-row .m-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.member-row .m-sub{font-size:10.5px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface2); border:1px solid var(--border2); color:var(--text);
    padding:11px 18px; border-radius:10px; font-size:12.5px; font-weight:600;
    opacity:0; transition:all .25s; z-index:999; max-width:88vw; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red-pale); color:var(--red); border-color:rgba(244,63,94,.25)}
.hidden{display:none !important}
.loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
    justify-content:center; z-index:999; flex-direction:column; gap:10px;
}
.spinner{width:28px; height:28px; border:3px solid var(--border2); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 🆕 Cuadro de Aceptar/Rechazar invitación: llama la atención al entrar
   con un leve "shake" + resplandor ámbar (mismo color que ya usa el
   resto del archivo para "pendiente"). Se reproduce unas pocas veces y
   se detiene — no queda animando para siempre. */
.inv-pendiente-box{border:1px solid var(--amber); border-radius:10px; padding:10px; background:var(--amber-pale); animation:invAtencion 2.6s ease-in-out 2;}
.inv-pendiente-box .row{margin:0}
@keyframes invAtencion{
    0%, 100% { transform:translateX(0); box-shadow:0 0 0 0 rgba(245,158,11,.35); }
    6%  { transform:translateX(-4px); }
    12% { transform:translateX(4px); }
    18% { transform:translateX(-3px); }
    24% { transform:translateX(3px); }
    30% { transform:translateX(0); box-shadow:0 0 0 6px rgba(245,158,11,.18); }
    55% { box-shadow:0 0 0 0 rgba(245,158,11,.35); }
}
/* 🆕 Aviso compacto cuando el creador cerró la sociedad — una sola fila,
   texto + botón "Aceptar", sin quedar huérfano ni ocupar de más. */
.cierre-aviso{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--border2); border-radius:10px; padding:10px 12px;
    background:var(--bg3);
}
.cierre-aviso-txt{font-size:12.5px; color:var(--text); font-weight:600; line-height:1.3}
.cierre-aviso .btn-sm{flex:0 0 auto; margin-top:0}
.sep{height:1px; background:var(--border); margin:14px 0}
.tag-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.tag{background:var(--bg3); border:1px solid var(--border2); border-radius:8px; padding:5px 9px; font-size:11.5px; display:flex; align-items:center; gap:6px}
.tag button{background:var(--blue); color:#fff; border:none; border-radius:6px; padding:3px 8px; font-size:10px; font-weight:700; cursor:pointer}
.confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:600;
    display:none; align-items:center; justify-content:center; padding:16px;
}
.confirm-overlay.show{display:flex}
.confirm-box{
    background:var(--surface); border:1px solid var(--border2); border-radius:14px;
    padding:22px 20px; width:100%; max-width:340px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.confirm-box h3{font-size:15px; font-weight:800; margin-bottom:8px}
.confirm-box p{font-size:12.5px; color:var(--text2); margin-bottom:18px; white-space:pre-line}
.confirm-actions{display:flex; gap:9px}
.confirm-actions button{
    flex:1; padding:10px; border-radius:9px; font-size:12.5px; font-weight:700;
    cursor:pointer; font-family:var(--font); border:none;
}
.confirm-cancel{background:var(--bg3); color:var(--text2); border:1px solid var(--border2) !important}
.confirm-ok{color:#fff}
.cat-trigger{
    width:100%; background:var(--bg3); border:1px solid var(--border2); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:13.5px; font-family:var(--font);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    cursor:pointer; text-align:left;
}
.cat-trigger:active{opacity:.85}
.cat-trigger svg{flex-shrink:0; color:var(--text2)}
.picker-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:700;
    display:none; align-items:flex-end; justify-content:center; padding:0;
}
.picker-overlay.show{display:flex}
.picker-sheet{
    background:var(--bg2); border-radius:18px 18px 0 0; max-width:640px; width:100%;
    max-height:70vh; overflow-y:auto; padding:16px; box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
.picker-sheet h3{font-size:14px; font-weight:800; margin-bottom:10px}
.picker-option{
    padding:13px 10px; font-size:13.5px; border-top:1px solid var(--border);
    cursor:pointer; display:flex; align-items:center; justify-content:space-between;
}
.picker-option:first-child{border-top:none}
.picker-option:active{background:var(--bg3)}
.picker-option.selected{color:var(--green); font-weight:700}
.picker-cancelar{
    width:100%; margin-top:10px; padding:11px; border-radius:9px; font-size:13px; font-weight:700;
    cursor:pointer; font-family:var(--font); border:1px solid var(--border2);
    background:var(--bg3); color:var(--text2);
}

/* 🆕 FIX: el archivo no tenía ninguna media query para celular — el .wrap
   fijo en 92vw, sumado al padding de .wrap y de cada .card, dejaba poco
   ancho real disponible y los textos de botones/títulos se partían en 2
   renglones. En celular, el contenido ahora usa el ancho completo de la
   pantalla (con su propio padding como único margen) y la tipografía de
   botones queda un poco más compacta. No afecta el diseño de escritorio
   (min(92vw, 820px) sigue intacto arriba de este breakpoint). */
@media (max-width:640px){
    .wrap{max-width:none; width:100%; padding:12px}
    .card{padding:12px}
    .btn{font-size:12.5px; padding:10px 12px}
    .btn-sm{font-size:11.5px; padding:6px 10px}
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">

</div>

<div class="topbar">

<script>
// ═══════════════════════════════════════════════════════════════
// Sociedades — se conecta ÚNICAMENTE a sociedadesworker.tuweb.workers.dev
// Reutiliza la MISMA sesión de Firebase que index (1).html (mismo
// firebaseConfig, mismas claves de localStorage) para identificar al
// revendedor logueado, sin tocar ni depender de ningún otro archivo.
// ═══════════════════════════════════════════════════════════════

const WORKER_SOCIEDADES = 'https://sociedadesworker.tuweb.workers.dev';
const S_KEY = 'rw_reseller_v1';

const NICHO_LABEL = {
    perfumes: 'Perfumería', belleza: 'Belleza y Cuidado Personal', calzados: 'Calzados Importados',
    bazar: 'Bazar', jugueteria: 'Juguetería', libreria: 'Librería', lenceria: 'Conjuntos/Lencería',
    indumentaria: 'Remeras Premium brn', suplementos: 'Salud/Suplementos', multishop: 'Multishop'
};

let miCodigo = '';
let miUid = '';
let miNombre = '';
let miCiudad = '';

function toast(msg, ok) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (ok ? '' : ' err');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// Reemplazo compacto y prolijo del confirm() nativo del navegador.
// Devuelve una Promise<boolean> — usar con `await`.
function confirmarModal(mensaje, opciones = {}) {
    const { titulo = '¿Confirmar?', textoConfirmar = 'Confirmar', danger = true } = opciones;
    return new Promise(resolve => {
        let overlay = document.getElementById('confirmModalGlobal');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'confirmModalGlobal';
            overlay.className = 'confirm-overlay';
            overlay.innerHTML = `
                <div class="confirm-box">
                    <h3 id="confirmModalTitulo"></h3>
                    <p id="confirmModalMensaje"></p>
                    <div class="confirm-actions">
                        <button class="confirm-cancel" id="confirmModalCancelar">Cancelar</button>
                        <button class="confirm-ok" id="confirmModalOk"></button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }
        overlay.querySelector('#confirmModalTitulo').textContent = titulo;
        overlay.querySelector('#confirmModalMensaje').textContent = mensaje;
        const btnOk = overlay.querySelector('#confirmModalOk');
        const btnCancelar = overlay.querySelector('#confirmModalCancelar');
        btnOk.textContent = textoConfirmar;
        btnOk.style.background = danger ? 'var(--red)' : 'var(--green)';
        btnOk.style.color = danger ? '#fff' : '#0b0d12';
        overlay.classList.add('show');

        const cerrar = resultado => {
            overlay.classList.remove('show');
            btnOk.removeEventListener('click', onOk);
            btnCancelar.removeEventListener('click', onCancelar);
            overlay.removeEventListener('click', onOverlayClick);
            resolve(resultado);
        };
        const onOk = () => cerrar(true);
        const onCancelar = () => cerrar(false);
        const onOverlayClick = e => { if (e.target === overlay) cerrar(false); };
        btnOk.addEventListener('click', onOk);
        btnCancelar.addEventListener('click', onCancelar);
        overlay.addEventListener('click', onOverlayClick);
    });
}

function poblarSelect(sel) {
    sel.innerHTML = Object.keys(NICHO_LABEL).map(k => `<option value="${k}">${NICHO_LABEL[k]}</option>`).join('');
}

// Reemplazo compacto y prolijo del <select> nativo del navegador para elegir
// categoría. El <select> real queda oculto y sigue siendo la única fuente
// de verdad de su .value — esto solo agrega una capa visual encima.
function actualizarTriggerCategoria(selectId) {
    const sel = document.getElementById(selectId);
    const label = document.getElementById(selectId + 'TriggerLabel');
    if (!sel || !label) return;
    const opt = sel.options[sel.selectedIndex];
    label.textContent = opt ? opt.textContent : 'Elegir categoría';
}

function abrirPickerCategoria(selectId) {
    const sel = document.getElementById(selectId);
    if (!sel) return;

    let overlay = document.getElementById('pickerCategoriaGlobal');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'pickerCategoriaGlobal';
        overlay.className = 'picker-overlay';
        overlay.innerHTML = `
            <div class="picker-sheet">
                <h3>Elegí una categoría</h3>
                <div id="pickerCategoriaLista"></div>
                <button type="button" class="picker-cancelar" id="pickerCategoriaCancelar">Cancelar</button>
            </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) cerrarPickerCategoria(); });
        overlay.querySelector('#pickerCategoriaCancelar').addEventListener('click', cerrarPickerCategoria);
    }

    const lista = overlay.querySelector('#pickerCategoriaLista');
    lista.innerHTML = Array.from(sel.options).map(opt => `
        <div class="picker-option${opt.value === sel.value ? ' selected' : ''}" data-value="${esc(opt.value)}">
            ${esc(opt.textContent)}
        </div>`).join('');
    lista.querySelectorAll('.picker-option').forEach(el => {
        el.addEventListener('click', () => {
            sel.value = el.getAttribute('data-value');
            actualizarTriggerCategoria(selectId);
            cerrarPickerCategoria();
        });
    });

    overlay.classList.add('show');
}

function cerrarPickerCategoria() {
    const overlay = document.getElementById('pickerCategoriaGlobal');
    if (overlay) overlay.classList.remove('show');
}

const firebaseConfig = {
    apiKey: "AIzaSyBRzd3HXbY6xIBIBNkzATo70kredodhKwc",
    authDomain: "revende-weys.firebaseapp.com",
    projectId: "revende-weys",

function irALogin() {
    document.getElementById('loadingScreen').innerHTML =
        '<div style="text-align:center;padding:0 24px">' +
        '<div style="font-size:13px;color:var(--text2);margin-bottom:12px">Necesitás iniciar sesión en tu panel para usar Sociedades.</div>' +
        '<button class="btn btn-primary" style="width:auto" onclick="window.location.href=\'index (1).html\'">Ir a mi panel</button>' +
        '</div>';
}

_auth.onAuthStateChanged(async (fbUser) => {
    if (!fbUser) { irALogin(); return; }
    try {
        const stored = sessionStorage.getItem(S_KEY) || localStorage.getItem(S_KEY);
        let sess = stored ? JSON.parse(stored) : null;
        if (!sess || !sess.code || sess.uid !== fbUser.uid) {
            // Sesión guardada no coincide — se resuelve directo por uid, igual que el panel.
            const snap = await _db.collection('usuarios').doc(fbUser.uid).get();
            if (!snap.exists) { irALogin(); return; }
            const d = snap.data();
            sess = { code: d.codigoVendedor, uid: fbUser.uid, nombre: d.nombre || '', apellido: d.apellido || '' };
        }
        miCodigo = sess.code;
        miUid = sess.uid;
        miNombre = [sess.nombre, sess.apellido].filter(Boolean).join(' ') || miCodigo;

        const perfil = await _db.collection('usuarios').doc(miUid).get();
        miCiudad = (perfil.exists && perfil.data().ciudad) ? perfil.data().ciudad : '';

        document.getElementById('inputCiudad').value = miCiudad || 'Sin ciudad cargada';
        document.getElementById('topbarSub').textContent = miNombre + (miCiudad ? ' · ' + miCiudad : '');
        poblarSelect(document.getElementById('selCategoria'));
        poblarSelect(document.getElementById('selCategoriaBuscar'));
        actualizarTriggerCategoria('selCategoria');
        actualizarTriggerCategoria('selCategoriaBuscar');

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('appWrap').style.display = 'block';

        if (!miCiudad) {
            toast('Cargá tu ciudad en "Completar Datos" desde el panel para poder usar Sociedades', false);
        }

        cargarMisSociedades();
        _checkRetornoMercadoPago();
    } catch (e) {
        console.error(e);
        irALogin();
    }
});

async function cargarMisSociedades() {
    const cont = document.getElementById('listaMias');
    if (!miCodigo) { cont.innerHTML = '<div class="empty">No se pudo identificar tu código de revendedor.</div>'; return; }
    try {
        const res = await fetch(`${WORKER_SOCIEDADES}/mias?codigo=${encodeURIComponent(miCodigo)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        if (!data.sociedades.length) {
            cont.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><div>Todavía no formás parte de ninguna sociedad.</div></div>';
            return;
        }
        cont.innerHTML = data.sociedades.map(s => renderSociedadItem(s)).join('');
    } catch (e) {
        cont.innerHTML = '<div class="empty">No se pudieron cargar tus sociedades.</div>';
    }
}

function pillEstado(s) {
    if (s.estado === 'pagada') return '<span class="pill pill-pagada">Pagada</span>';
    if (s.estado === 'cerrada') return '<span class="pill pill-cerrada">Cerrada</span>';
    return '<span class="pill pill-abierta">Abierta</span>';
}

function renderSociedadItem(s) {
    const cat = NICHO_LABEL[s.categoria] || s.categoria;
    const pendientes = (s.miembros || []).filter(m => m.codigo === miCodigo && (m.estado === 'pendiente_invitacion')).length;
    return `<div class="soc-item" onclick="abrirDetalle('${s.id}')">
        <div class="soc-head">
            <strong>${esc(cat)} · ${esc(s.ciudadLabel || s.ciudad)}</strong>
            ${pillEstado(s)}
        </div>
        <div class="soc-meta">Creada por ${esc(s.creadorNombre || s.creadorCodigo)} · ${(s.miembros||[]).filter(m=>m.estado==='aceptado').length} integrante(s)</div>
        ${pendientes ? '<div class="soc-meta soc-inv-pendiente-aviso" style="color:var(--amber);margin-top:4px">📩 Tenés una invitación pendiente — tocá para responder</div>' : ''}
    </div>`;
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== Componente reutilizable: lista de revendedores con buscador + paginado de 5 =====
const _listaRevState = {};

function montarListaRevendedores(idLista, contenedorId, lista, onInvitarFnName) {
    _listaRevState[idLista] = {
        contenedorId, lista: lista || [], onInvitar: onInvitarFnName,
        filtro: '', pagina: 0,
    };
    _rerenderListaRevendedores(idLista);
}

function _rerenderListaRevendedores(idLista) {
    const st = _listaRevState[idLista];
    if (!st) return;
    const cont = document.getElementById(st.contenedorId);
    if (!cont) return;

    const f = st.filtro.trim().toLowerCase();
    const filtrados = !f ? st.lista : st.lista.filter(r => {
        const campos = [r.nombre, r.apellido, r.whatsapp, r.codigo].map(x => String(x || '').toLowerCase());
        return campos.some(c => c.includes(f));
    });

    const porPagina = 5;
    const totalPaginas = Math.max(1, Math.ceil(filtrados.length / porPagina));
    if (st.pagina >= totalPaginas) st.pagina = totalPaginas - 1;
    if (st.pagina < 0) st.pagina = 0;
    const inicio = st.pagina * porPagina;
    const pageItems = filtrados.slice(inicio, inicio + porPagina);

    let html = `<input type="text" placeholder="Buscar por nombre, apellido o WhatsApp..."
        value="${esc(st.filtro)}" style="margin-bottom:8px"
        oninput="_listaRevState['${idLista}'].filtro = this.value; _listaRevState['${idLista}'].pagina = 0; _rerenderListaRevendedores('${idLista}')">`;

    if (!filtrados.length) {
        html += `<div class="empty">${st.lista.length ? 'No encontramos coincidencias.' : 'No encontramos revendedores en tu ciudad para esta categoría todavía.'}</div>`;
    } else {
        html += pageItems.map(r => `<div class="member-row">
            <div><div class="m-name">${esc(r.nombre)}</div>
            <div class="m-sub">${esc(r.whatsapp || r.codigo || '')}</div></div>
            <button class="btn btn-sm btn-primary" onclick="${st.onInvitar}('${esc(r.codigo)}')">Invitar</button>
        </div>`).join('');

        if (totalPaginas > 1) {
            html += `<div class="row" style="margin-top:8px;align-items:center;justify-content:space-between">
                <button class="btn btn-sm btn-outline" ${st.pagina <= 0 ? 'disabled' : ''}
                    onclick="_listaRevState['${idLista}'].pagina--; _rerenderListaRevendedores('${idLista}')">Anterior</button>
                <span style="font-size:11px;color:var(--text2)">Página ${st.pagina + 1} de ${totalPaginas}</span>
                <button class="btn btn-sm btn-outline" ${st.pagina >= totalPaginas - 1 ? 'disabled' : ''}
                    onclick="_listaRevState['${idLista}'].pagina++; _rerenderListaRevendedores('${idLista}')">Siguiente</button>
            </div>`;
        }
    }

    const inputPrevio = cont.querySelector('input');
    const teniaFoco = inputPrevio && document.activeElement === inputPrevio;
    const cursorPos = teniaFoco ? inputPrevio.selectionStart : null;

    cont.innerHTML = html;

    if (teniaFoco) {
        const inputNuevo = cont.querySelector('input');
        if (inputNuevo) {
            inputNuevo.focus();
            try { inputNuevo.setSelectionRange(cursorPos, cursorPos); } catch (_) {}
        }
    }
}

async function crearSociedad() {
    if (!miCiudad) { toast('Primero completá tu ciudad en el panel', false); return; }
    const categoria = document.getElementById('selCategoria').value;
    const btn = document.getElementById('btnCrear');
    btn.disabled = true; btn.textContent = 'Creando...';
    try {
        const res = await fetch(`${WORKER_SOCIEDADES}/crear`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigoVendedor: miCodigo, ciudad: miCiudad, categoria })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        toast('✅ Sociedad creada', true);
        cargarMisSociedades();
        abrirDetalle(data.sociedadId);
    } catch (e) {
        toast('No se pudo crear: ' + e.message, false);
    } finally {
        btn.disabled = false; btn.textContent = 'Crear sociedad en mi ciudad y categoría';
    }
}

function _invitarDesdeBusqueda(codigo) {
    crearEInvitar(window._categoriaBusquedaActual, codigo);
}

async function crearEInvitar(categoria, codigoInvitado) {
    try {
        // 🔧 FIX: si ya tengo una sociedad abierta para esta misma categoría,
        // invito ahí en vez de crear una duplicada — antes este botón SIEMPRE
        // creaba una sociedad nueva, aunque ya hubiera una mía esperando gente.
        let sociedadId = null;
        try {
            const resMias = await fetch(`${WORKER_SOCIEDADES}/mias?codigo=${encodeURIComponent(miCodigo)}`);
            const dataMias = await resMias.json();
            const existente = (dataMias.sociedades || []).find(s =>
                s.creadorCodigo === miCodigo && s.categoria === categoria && s.estado === 'abierta');
            if (existente) sociedadId = existente.id;
        } catch (_) {}

        if (!sociedadId) {
            const resCrear = await fetch(`${WORKER_SOCIEDADES}/crear`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigoVendedor: miCodigo, ciudad: miCiudad, categoria })
            });
            const dataCrear = await resCrear.json();
            if (!dataCrear.ok) throw new Error(dataCrear.error || 'Error al crear');
            sociedadId = dataCrear.sociedadId;
        }

        const resInv = await fetch(`${WORKER_SOCIEDADES}/invitar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sociedadId, codigoInvitado })
        });
        const dataInv = await resInv.json();
        if (!dataInv.ok) throw new Error(dataInv.error || 'Error al invitar');

        toast('✅ Invitación enviada', true);
        cargarMisSociedades();
        abrirDetalle(sociedadId);
    } catch (e) {
        toast('No se pudo invitar: ' + e.message, false);
    }
}

let sociedadActual = null;

async function abrirDetalle(sociedadId) {
    document.getElementById('modalDetalle').classList.remove('hidden');
    document.getElementById('detBody').innerHTML = '<div class="empty">Cargando...</div>';
    await refrescarDetalle(sociedadId);
}
function cerrarDetalle() {
    document.getElementById('modalDetalle').classList.add('hidden');
    sociedadActual = null;
}

async function refrescarDetalle(sociedadId) {
    try {
        const [resObj, resMias] = await Promise.all([
            fetch(`${WORKER_SOCIEDADES}/objetivo?sociedadId=${encodeURIComponent(sociedadId)}`),
            fetch(`${WORKER_SOCIEDADES}/mias?codigo=${encodeURIComponent(miCodigo)}`)
        ]);
        const obj = await resObj.json();
        const mias = await resMias.json();
        if (!obj.ok) throw new Error(obj.error || 'Error');
        const sociedad = (mias.sociedades || []).find(s => s.id === sociedadId);
        sociedadActual = sociedad || { id: sociedadId };
        renderDetalle(sociedadId, obj, sociedadActual);
    } catch (e) {
        document.getElementById('detBody').innerHTML = `<div class="empty">No se pudo cargar: ${esc(e.message)}</div>`;
    }
}

function renderDetalle(sociedadId, obj, sociedad) {
    document.getElementById('detTitulo').textContent = `${obj.categoriaLabel} · ${sociedad.ciudadLabel || sociedad.ciudad || ''}`;

    const unidad = obj.tipo === 'unidades' ? 'unidades' : '$';
    const actualTxt = obj.tipo === 'unidades' ? obj.valorActual : `$${Math.round(obj.valorActual).toLocaleString()}`;
    const objTxt = obj.tipo === 'unidades' ? obj.objetivo : `$${Math.round(obj.objetivo).toLocaleString()}`;

    const miMiembro = (sociedad.miembros || []).find(m => m.codigo === miCodigo);
    const soyCreador = sociedad.creadorCodigo === miCodigo;
    const tienePendiente = miMiembro && miMiembro.estado === 'pendiente_invitacion';
    const puedoSolicitar = !miMiembro;

    let html = `
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Progreso hacia el objetivo (${unidad === 'unidades' ? 'unidades' : 'monto mayorista'})</div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:2px">
            <span style="color:${obj.cumplido ? 'var(--green)' : 'var(--amber)'}">${actualTxt}</span>
            <span style="color:var(--text2);font-weight:600">de ${objTxt}</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${obj.cumplido ? '' : 'falta'}" style="width:${obj.porcentaje}%"></div></div>
        <div style="font-size:11px;margin-top:6px;color:${obj.cumplido ? 'var(--green)' : 'var(--text2)'}">
            ${obj.cumplido ? '✅ Objetivo alcanzado — ya se puede pagar el lote' : 'Todavía falta sumar pedidos para llegar al mínimo de la categoría'}
        </div>
        <div class="sep"></div>
        <div style="font-size:11px;color:var(--text2);font-weight:700;margin-bottom:4px">INTEGRANTES</div>
    `;

    (sociedad.miembros || []).forEach(m => {
        const prog = (obj.porMiembro || []).find(p => p.codigo === m.codigo);
        let estadoTxt = '';
        if (m.estado === 'pendiente_invitacion') estadoTxt = '<span class="pill pill-pendiente">Invitado — sin responder</span>';
        else if (m.estado === 'pendiente_solicitud') estadoTxt = '<span class="pill pill-pendiente">Pidió unirse</span>';
        else if (m.estado === 'rechazado') estadoTxt = '<span class="pill pill-cerrada">Rechazó</span>';
        html += `<div class="member-row">
            <div>
                <div class="m-name">${esc(m.nombre)} ${m.rol === 'creador' ? '👑' : ''}</div>
                <div class="m-sub">${prog ? (obj.tipo === 'unidades' ? prog.unidades + ' unidades' : '$' + Math.round(prog.totalMayorista).toLocaleString()) + ' · ' + prog.cantidadPedidos + ' pedido(s)' : (m.estado === 'aceptado' ? 'sin pedidos todavía' : '')}</div>
            </div>
            ${estadoTxt}
        </div>`;
    });

    html += '<div class="sep"></div>';

    // 🔧 NUEVO: el creador tiene que poder aceptar/rechazar a quien pidió
    // unirse (estado "pendiente_solicitud") — antes esto no tenía ningún
    // botón y la solicitud quedaba trabada para siempre.
    if (soyCreador) {
        const solicitudes = (sociedad.miembros || []).filter(m => m.estado === 'pendiente_solicitud');
        if (solicitudes.length) {
            html += '<div style="font-size:11px;color:var(--text2);font-weight:700;margin-bottom:6px">SOLICITUDES PARA UNIRSE</div>';
            solicitudes.forEach(m => {
                html += `<div class="member-row">
                    <div class="m-name">${esc(m.nombre)}</div>
                    <div class="row" style="margin-top:0">
                        <button class="btn btn-sm btn-green" onclick="responderMiembro('${sociedadId}','${esc(m.codigo)}', true)">Aceptar</button>
                        <button class="btn btn-sm btn-red" onclick="responderMiembro('${sociedadId}','${esc(m.codigo)}', false)">Rechazar</button>
                    </div>
                </div>`;
            });
            html += '<div class="sep"></div>';
        }
    }

    if (tienePendiente) {
        html += `<div class="inv-pendiente-box">
            <div class="row">
                <button class="btn btn-green" onclick="responder('${sociedadId}', true)">Aceptar invitación</button>
                <button class="btn btn-red" onclick="responder('${sociedadId}', false)">Rechazar</button>
            </div>
        </div>`;
    } else if (puedoSolicitar && sociedad.estado === 'abierta') {
        html += `<button class="btn btn-outline" onclick="solicitarUnirme('${sociedadId}')">Pedir unirme a esta sociedad</button>`;
    } else if (soyCreador && sociedad.estado === 'abierta') {
        html += `
            <label>Invitar revendedores de tu ciudad</label>
            <div id="listaRevendedoresInvitar"><div class="empty">Buscando revendedores de tu ciudad...</div></div>
            <div class="sep"></div>
            <label style="font-size:11px;color:var(--text2)">¿Ya tenés el código de alguien? Escribilo directo:</label>
            <div class="row">
                <input id="inputCodigoInvitar" type="text" placeholder="Código del revendedor (ej: RW-ABC123)">
                <button class="btn btn-sm btn-primary" style="flex:0 0 auto" onclick="invitarPorCodigo('${sociedadId}')">Invitar</button>
            </div>
            <div class="sep"></div>
            <button class="btn btn-green" id="btnPagar" ${obj.cumplido ? '' : 'disabled'} onclick="pagarLote('${sociedadId}')">
                ${obj.cumplido ? 'Pagar lote con Mercado Pago' : 'Todavía falta alcanzar el objetivo'}
            </button>
            <button class="btn btn-outline" style="margin-top:8px" onclick="cerrarSociedad('${sociedadId}')">Cerrar esta sociedad</button>
        `;
    } else if (sociedad.estado === 'pagada') {
        html += `<div class="empty" style="color:var(--green)">✅ Esta sociedad ya pagó su lote conjunto.</div>`;
    } else if (sociedad.estado === 'cerrada') {
        // 🆕 Al integrante (no al creador, que ya sabe que la cerró él
        // mismo) se le muestra un aviso compacto con el nombre del creador
        // y un botón "Aceptar" — una sola vez, hasta que lo toque (ver
        // POST /cierre-visto). Después de aceptado, queda el texto neutro
        // de siempre.
        if (!soyCreador && miMiembro && !miMiembro.cierreVisto) {
            html += `<div class="cierre-aviso">
                <span class="cierre-aviso-txt">${esc(sociedad.creadorNombre || sociedad.creadorCodigo)} cerró la sociedad</span>
                <button class="btn btn-sm btn-outline" onclick="aceptarCierreSociedad('${sociedadId}')">Aceptar</button>
            </div>`;
        } else {
            html += `<div class="empty">Esta sociedad fue cerrada por el creador.</div>`;
        }
        if (soyCreador) {
            html += `<div class="row" style="margin-top:8px">
                <button class="btn btn-sm btn-green" onclick="reactivarSociedad('${sociedadId}')">Volver a activar</button>
                <button class="btn btn-sm btn-red" onclick="eliminarSociedad('${sociedadId}')">Eliminar</button>
            </div>`;
        }
    }

    if (!soyCreador && miMiembro && miMiembro.estado === 'aceptado' && sociedad.estado === 'abierta') {
        html += `<button class="btn btn-outline" style="margin-top:10px" onclick="salirSociedad('${sociedadId}')">Salir de esta sociedad</button>`;
    }

    document.getElementById('detBody').innerHTML = html;

    if (soyCreador && sociedad.estado === 'abierta') {
        cargarListaInvitar(sociedadId, sociedad);
    }
}

async function cargarListaInvitar(sociedadId, sociedad) {
    const cont = document.getElementById('listaRevendedoresInvitar');
    if (!cont) return;
    try {
        const res = await fetch(`${WORKER_SOCIEDADES}/buscar?ciudad=${encodeURIComponent(sociedad.ciudad || miCiudad)}&categoria=${encodeURIComponent(sociedad.categoria)}&codigo=${encodeURIComponent(miCodigo)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        const yaEnSociedad = new Set((sociedad.miembros || []).map(m => m.codigo));
        const revendedores = (data.revendedores || []).filter(r => !yaEnSociedad.has(r.codigo));
        window._sociedadInvitarActual = sociedadId;
        montarListaRevendedores('invitar-' + sociedadId, 'listaRevendedoresInvitar', revendedores, '_invitarDesdeSociedad');
    } catch (e) {
        cont.innerHTML = '<div class="empty">No se pudo cargar la lista de revendedores.</div>';
    }
}

function _invitarDesdeSociedad(codigo) {
    invitarDirecto(window._sociedadInvitarActual, codigo);
}

async function responder(sociedadId, aceptar) {
    try {
        const res = await fetch(`${WORKER_SOCIEDADES}/responder`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sociedadId, codigoVendedor: miCodigo, aceptar })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        toast(aceptar ? '✅ Te uniste a la sociedad' : 'Invitación rechazada', true);
        cargarMisSociedades();
        refrescarDetalle(sociedadId);
    } catch (e) {
        toast('No se pudo responder: ' + e.message, false);
    }
}

// Variante de responder() para cuando el CREADOR acepta/rechaza la
// solicitud de OTRO integrante (responder() siempre usa miCodigo, que acá
// no corresponde — el que responde es el creador, pero a quien se le
// cambia el estado es al solicitante).
async function responderMiembro(sociedadId, codigoSolicitante, aceptar) {
    try {
        const res = await fetch(`${WORKER_SOCIEDADES}/responder`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sociedadId, codigoVendedor: codigoSolicitante, aceptar })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        toast(aceptar ? '✅ Se sumó a la sociedad' : 'Solicitud rechazada', true);
        cargarMisSociedades();
        refrescarDetalle(sociedadId);
    } catch (e) {
        toast('No se pudo responder: ' + e.message, false);
    }
}

async function pagarLote(sociedadId) {
    const btn = document.getElementById('btnPagar');
    if (btn) { btn.disabled = true; btn.textContent = 'Generando pago...'; }
    try {
        const returnBase = window.location.origin + window.location.pathname;
        const res = await fetch(`${WORKER_SOCIEDADES}/pagar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sociedadId, codigoVendedor: miCodigo, returnBase })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error');
        window.location.href = data.init_point;
    } catch (e) {
        toast('No se pudo generar el pago: ' + e.message, false);
        if (btn) { btn.disabled = false; btn.textContent = 'Pagar lote con Mercado Pago'; }
    }
}

// 🔧 FASE 3: al volver de Mercado Pago (mismo patrón que
// _checkMercadoPagoReturn en index(1).html), se detecta el regreso por
// los parámetros de la URL y se le pregunta al Worker si workerpagos ya
// confirmó el pago real. Si todavía está "pendiente" (el webhook de MP a
// veces tarda unos segundos más que el redirect), se reintenta un par de
// veces antes de avisarle a la persona.
async function _checkRetornoMercadoPago() {
    const params = new URLSearchParams(window.location.search);
    const sociedadId = params.get('sociedad');
    const status = params.get('status');
    if (!sociedadId || !status) return;

    // Limpia los parámetros de la URL para no volver a disparar esto si
    // la persona refresca la página.
    const urlLimpia = window.location.origin + window.location.pathname;
    window.history.replaceState({}, '', urlLimpia);

    if (status !== 'approved' && status !== 'pending') {
        toast(status === 'failure' ? 'El pago no se completó' : 'Pago pendiente de aprobación', status !== 'failure');
        return;
    }

    toast('Confirmando el pago...', true);
    for (let intento = 0; intento < 6; intento++) {
        try {
            const res = await fetch(`${WORKER_SOCIEDADES}/confirmar-pago`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sociedadId })
            });
            const data = await res.json();
            if (data.ok && (data.estado === 'confirmado' || data.estado === 'ya_confirmado')) {
                toast('✅ Pago confirmado — ganancias repartidas', true);
                cargarMisSociedades();
                abrirDetalle(sociedadId);
                return;
            }
        } catch (_) {}
        await new Promise(r => setTimeout(r, 4000));
    }
    toast('El pago todavía se está procesando — volvé a entrar en unos minutos', false);
}
